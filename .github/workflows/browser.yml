name: Browser

# The check as a web page in headless Chrome, with WebGL2 on the runner's GPU
# on macOS and SwiftShader on Linux, compiled to wasm with hxcpp and served by
# emrun, and with Ash, threaded, and served by `ash serve`, whose WebGL2
# browser agent runs in a Worker of its own.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: ${{ matrix.runtime }}, Chrome, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            runtime: hxcpp
            check: cpp --wasm
          - os: ubuntu-latest
            runtime: hxcpp
            check: cpp --wasm
            flags: --enable-unsafe-swiftshader --use-angle=swiftshader
          - os: macos-latest
            runtime: hxcpp threaded
            check: cpp --wasm --threads
          - os: ubuntu-latest
            runtime: hxcpp threaded
            check: cpp --wasm --threads
            flags: --enable-unsafe-swiftshader --use-angle=swiftshader
          - os: macos-latest
            runtime: Ash
            check: hl --wasm --threads
          - os: ubuntu-latest
            runtime: Ash
            check: hl --wasm --threads
            flags: --enable-unsafe-swiftshader --use-angle=swiftshader
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Fails without WebGL2, rather than passing on the line the check prints
      # without it.
      - env:
          HXN_BROWSER_ARGS: ${{ matrix.flags }}
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          hxn check ${{ matrix.check }} --browser 2>&1 | tee check.txt
          grep -q '^render: 4x4 pixels' check.txt
          grep -q '^textured: 4x4 pixels' check.txt
          grep -q '^buffer: 16 values' check.txt
          grep -q '^canvas: a 64x64 frame' check.txt
