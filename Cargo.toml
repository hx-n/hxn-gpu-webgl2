[package]
name = "hxn-gpu-webgl2"
version = "0.3.1"
edition = "2024"
description = "WebGL2 for Haxe in the browser, on hxcpp and Ash compiled to wasm: buffers, textures, samplers, programs, vertex arrays and framebuffers"
repository = "https://github.com/hx-n/hxn-gpu-webgl2"
license = "Apache-2.0"
keywords = ["webgl2", "webgl", "gpu", "haxe", "graphics", "glsl", "wasm", "emscripten", "browser", "hxcpp", "hashlink", "native", "cross"]

[lib]
name = "hxn_gpu_webgl2"

[package.metadata.hxn]
library = "gpu_webgl2"
haxelib = "hxn-gpu-webgl2"
contributors = ["darmie", "rayzor"]
releasenote = "In a threaded hxcpp build WebGL2 runs in a browser agent, as under Ash, so await works on what the browser settles, under hxcpp and Ash alike. Needs hxn 0.3.6."
haxe = "examples/check"
haxe-flags = ["-lib", "hxnsl"]
# Registers hxnsl's GLSL target for hxn.gpu.webgl2.Shader, from sources/.
init = ["hxn.gpu.webgl2.Shaders.register()"]

# Emscripten's OpenGL ES 3.0 is WebGL2. A threaded build uses the browser
# agent instead, which takes the canvas when the program claims it.
[package.metadata.hxn.link-args]
wasm32-unknown-emscripten = ["-sMIN_WEBGL_VERSION=2", "-sMAX_WEBGL_VERSION=2"]

[dependencies]
hxn = { git = "https://github.com/hx-n/hxn.git", tag = "v0.3.6" }
hxn-future = { git = "https://github.com/hx-n/hxn.git", tag = "v0.3.6" }

[build-dependencies]
cc = "1"
