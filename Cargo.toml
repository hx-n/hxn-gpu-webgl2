[package]
name = "hxn-gpu-webgl2"
version = "0.1.0"
edition = "2024"
description = "WebGL2 for Haxe in the browser, on hxcpp and Ash compiled to wasm: buffers, textures, samplers, programs, vertex arrays and framebuffers"
repository = "https://github.com/hx-n/hxn-gpu-webgl2"
license = "Apache-2.0"
keywords = ["webgl2", "webgl", "gpu", "haxe", "graphics", "glsl", "wasm", "emscripten", "browser"]

[lib]
name = "hxn_gpu_webgl2"

[package.metadata.hxn]
library = "gpu_webgl2"
haxelib = "hxn-gpu-webgl2"
contributors = ["darmie", "rayzor"]
releasenote = "First release."
haxe = "examples/check"
haxe-flags = ["-lib", "hxnsl"]
# Registers hxnsl's GLSL target for gpu.webgl2.Shader, from sources/.
init = ["gpu.webgl2.Shaders.register()"]

# Emscripten's OpenGL ES 3.0 is WebGL2. A threaded build runs main on a
# pthread, which the web page's canvas is transferred to.
[package.metadata.hxn.link-args]
wasm32-unknown-emscripten = ["-sMIN_WEBGL_VERSION=2", "-sMAX_WEBGL_VERSION=2"]
wasm32-unknown-emscripten-threads = ["-sOFFSCREENCANVAS_SUPPORT"]

[dependencies]
# hxn after 0.3.3: Ash wasm libraries linked with --native-lib, threaded
# hxcpp builds for Emscripten, page files and Ash web pages.
hxn = { git = "https://github.com/hx-n/hxn.git", rev = "10afe2f" }
hxn-future = { git = "https://github.com/hx-n/hxn.git", rev = "10afe2f" }
